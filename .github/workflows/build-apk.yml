name: Build Netflix Ad Shield APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Run Unit Tests & Build Debug APK
        run: |
          gradle testDebugUnitTest --stacktrace
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/netflix-ad-shield-v1.0.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-ad-shield-v1.0.1.apk
          path: app/build/outputs/apk/debug/netflix-ad-shield-v1.0.1.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Netflix Ad Shield v1.0.1 (実機Netflix Compose広告ノード対応)
          body: |
            ## Netflix Ad Shield v1.0.1

            実機診断ログに基づき、最新の Netflix Android 公式アプリ（Jetpack Compose プレーヤー）の広告UIに完全対応しました。

            ### 改善内容
            - **Netflix Compose 広告ノード対応**: `adBreakProgressIndicator`（キャメルケースID）および日本語/英語の広告再生中デスクリプション（`2本中1本目の広告を再生中です。残り23秒です` 等）を確実に検知
            - **残り秒数のライブ表示**: 真っ黒カバー中央に Netflix 広告の残り秒数・本数（例: `2本中1本目の広告を再生中です。残り23秒です`）をリアルタイム表示
            - **誤検知防止維持**: 字幕・あらすじや空の `Ads` ホストコンテナ単体では誤発動しないことを16件のユニットテストで検証済み
          files: app/build/outputs/apk/debug/netflix-ad-shield-v1.0.1.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
