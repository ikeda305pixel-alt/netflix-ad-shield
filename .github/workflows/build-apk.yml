name: Build Netflix Ad Shield APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Run Unit Tests & Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/netflix-ad-shield-v1.2.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-ad-shield-v1.2.1.apk
          path: app/build/outputs/apk/debug/netflix-ad-shield-v1.2.1.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: Netflix Ad Shield v1.2.1 (「ログ採取」オーバーレイ残留バグ修正)
          body: |
            ## Netflix Ad Shield v1.2.1

            Netflixを閉じてホーム画面に戻ったあとも右上の「ログ採取」フローティングボタンが画面に残り続ける不具合を修正しました。

            ### 修正内容
            - **`removeViewImmediate()` による即時破棄**: `OverlayCoverManager` のオーバーレイ破棄（カバー／ログ採取ボタン両方）を非同期 `removeView()` から同期 `windowManager.removeViewImmediate()` に変更。
            - **`onUnbind()` / `onDestroy()` での確実なクリーンアップ**: PayPay両立モード（Watchdog）によりユーザー補助が自動OFFにされた際も、オーバーレイが確実に破棄されるよう `onUnbind()` をオーバーライドし、Watchdog側からの即時クリアも連動。
            - **ジェスチャーナビでのホーム復帰検知強化**: ポーリング中および他アプリイベント受信時に `findNetflixRootWindow() == null` を確認し、Netflixが画面から消えたら即座にオーバーレイを破棄。
          files: app/build/outputs/apk/debug/netflix-ad-shield-v1.2.1.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
