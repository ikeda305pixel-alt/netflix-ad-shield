name: Build Netflix Ad Shield APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Run Unit Tests & Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/netflix-ad-shield-v1.2.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-ad-shield-v1.2.0.apk
          path: app/build/outputs/apk/debug/netflix-ad-shield-v1.2.0.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Netflix Ad Shield v1.2.0 (Shizuku内蔵・PC不要ワンタップ権限付与対応)
          body: |
            ## Netflix Ad Shield v1.2.0

            **PC不要・コマンド入力ゼロ**で PayPay両立モードの権限（`WRITE_SECURE_SETTINGS` + `GET_USAGE_STATS`）を付与できる **Shizuku ワンタップ連携ボタン** をアプリ内に内蔵しました。

            ### 新機能
            - **Shizuku 1タップ権限付与 (`ShizukuGrantManager` / `ShizukuPermissionGranterService`)**: Shizukuを起動した状態でアプリ内の「Shizukuで権限を一括付与」を押すだけで、2つの権限を自動付与（コマンド入力・aShell・PCすべて不要）。
            - **初回1回きりで永続**: 付与した `WRITE_SECURE_SETTINGS` と使用状況アクセス権限は端末再起動後も保持されるため、設定後はShizukuやワイヤレスデバッグをOFFに戻して運用できます。
            - **PayPay両立モード＆既存機能すべて維持**: ユニットテスト32件全件PASS。
          files: app/build/outputs/apk/debug/netflix-ad-shield-v1.2.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
